    <!-- Crucial Auto-Recovery and Self-Healing Cache Handler -->
    <script>
      const forceSelfHealReload = () => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then((keys) => {
            Promise.all(keys.map((key) => caches.delete(key))).then(() => {
              window.location.reload(true);
            });
          });
        } else {
          window.location.reload(true);
        }
      };

      window.addEventListener('vite:preloadError', (e) => {
        console.warn('[MyDocify Auto-Heal] Chunk load failure detected. Triggering self-heal reload...', e);
        forceSelfHealReload();
      });

      window.addEventListener('error', (e) => {
        const target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          const url = target.src || target.href;
          if (url && url.startsWith(window.location.origin) && (url.includes('/assets/') || url.includes('.js') || url.includes('.css'))) {
            console.warn('[MyDocify Auto-Heal] Missing compiled asset chunk detected:', url);
            forceSelfHealReload();
          }
        }
      }, true);
    </script>
